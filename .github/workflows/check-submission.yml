name: Check Submission

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] labels/comments on fork PRs need a write token; no PR code is checked out or run
    types: [opened, edited, synchronize, closed]

# Default is read-only. Each job below asks for exactly what it needs.
permissions:
  contents: read

jobs:
  # Post-merge welcome comment
  welcome:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post welcome comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- welcome-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });

            if (!comments.some(c => c.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${marker}\nThank you for your contribution! Your server has been merged.

            Are you in the MCP [Discord](https://glama.ai/mcp/discord)? Let me know your Discord username and I will give you a **server-author** flair.`
              });
            }

  # Unprivileged: parses the PR diff and probes contributor-supplied endpoints.
  # The token here is read-only, so a probe that is steered somewhere it should
  # not be has no write access to leak or abuse. All outbound requests go
  # through .github/scripts/safe-fetch.js (https/443, DNS names only, public
  # addresses only, validated connect address, re-validated redirects).
  check-submission:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      # Checks out the BASE branch, never PR-authored code. Do not change this
      # to check out the head ref: this workflow is triggered by
      # pull_request_target and must never run PR-authored code.
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Validate PR submission
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # github-script writes the script's return value to the `result`
          # output after the script ends (JSON, see result-encoding), so return
          # the validator result instead of calling core.setOutput('result').
          script: |
            const checkSubmission = require('./.github/scripts/check-submission.js');
            return await checkSubmission({ github, context });

  # Privileged: applies labels and comments. Runs no contributor URL probes and
  # checks out nothing. It treats the validator output as untrusted data:
  # label names and comment ids are allowlisted and bodies are length-capped.
  report:
    needs: check-submission
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Apply labels and comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULT: ${{ needs.check-submission.outputs.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const LABELS = new Set([
              'endpoint-ok', 'endpoint-unreachable', 'has-connector',
              'missing-connector', 'invalid-format', 'duplicate',
            ]);
            const MARKERS = new Set([
              'endpoint-check', 'auth-check', 'format-check',
              'badge-check', 'connector-check', 'duplicate-check',
            ]);
            const MAX_BODY = 60000;

            const result = JSON.parse(process.env.RESULT);
            const add = [...new Set(result.add)].filter(l => LABELS.has(l));
            const remove = [...new Set(result.remove)].filter(l => LABELS.has(l));

            if (add.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: add });
            }
            for (const name of remove) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name }); } catch {}
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            for (const c of result.comments) {
              if (!MARKERS.has(c.id)) continue;
              const marker = `<!-- ${c.id} -->`;
              if (comments.some(x => x.body.includes(marker))) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${marker}\n${String(c.body).slice(0, MAX_BODY)}`,
              });
            }
